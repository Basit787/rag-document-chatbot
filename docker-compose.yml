name: rag-document-chatbot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: alpine/ollama:0.40.13
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: alpine/ollama:0.40.13
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    # Default chat model + a tiny one (135M params, ~92 MB) for the model picker, and the embedding model for document search.
    # Each pull retries 5 times. An interrupted download can leave broken "-partial" files
    # that make every later pull fail with "Error: EOF", so a failed attempt deletes them first.
    entrypoint:
      - sh
      - -c
      - |
        pull() {
          for attempt in 1 2 3 4 5; do
            ollama pull "$$1" && return 0
            echo "Pull of $$1 failed (attempt $$attempt), clearing partial downloads, retrying in 5s"
            rm -f /root/.ollama/models/blobs/*-partial*
            sleep 5
          done
          return 1
        }
        pull ${OLLAMA_MODEL:-llama3.2} &&
          pull ${OLLAMA_SMALL_MODEL:-smollm2:135m-instruct-q4_0} &&
          pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot}@postgres:5432/${POSTGRES_DB:-chatbot}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  client:
    build:
      context: .
      target: client
    restart: unless-stopped
    environment:
      API_URL: http://server:3001
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  postgres_data:
  ollama_data:
